[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-operations-agent"
version = "0.1.0"
description = "Lightweight Python task queues and browser resource pool"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1,<4"]

[project.scripts]
agent-platform = "agent_platform.__main__:main"

[tool.setuptools.packages.find]
include = ["agent_platform*"]

